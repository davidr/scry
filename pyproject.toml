[project]
name = "scry"
version = "0.0.1c"
description = "Interactive tmux window manager with session grouping support."
authors = [
    { name = "David Ressman", email = "davidr@ressman.org" },
]
license = { text = "BSD 3-Clause License" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich>=13.0",
    "PyYAML>=6.0",
]

[project.scripts]
scry = "scry.__main__:run_scry"

[build-system]
requires = ["uv_build>=0.7,<1"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["scry"]
